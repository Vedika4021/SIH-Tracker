name: SIH Submission Tracker Automation

on:
  schedule:
    - cron: '0 * * * *'  # 👈 Runs automatically every 1 hour
  workflow_dispatch:        # Allows manual triggers anytime

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Run Python Scraper
        run: python script.py

      - name: Commit and push changes if data updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Hourly automated update: SIH26264 submission log [skip ci]"
          file_pattern: 'data/sih_history.csv'